[project]
name = "citecheck"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "amaanmithani", email = "101476296+amaanmithani@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.8",
    "sentencepiece>=0.2.2",
    "torch>=2.4",
    "transformers>=4.44",
    "uvicorn>=0.30",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Typographic quotes and dashes are handled on purpose (citation ranges, quoted sentences).
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["scripts/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
addopts = "--cov=citecheck --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["src/citecheck/rag.py"]
